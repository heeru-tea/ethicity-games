 그날 민호의 행동 기록(가상 로그)을 살펴본다.", "Check the robot manual and the record of what Minho did."], "options": [["민호의 행동은 안 보고 화분이 깨진 자리만 봐요", "Only look at where the pot broke, not Minho’s actions."], ["청소로봇 설명서와 민호의 행동 기록을 둘 다 확인해요", "Check both the manual and Minho’s action record."], ["가영이에게 \"네가 화분을 잘못 둔 거예요\"라고 먼저 말해요", "First tell Gayoung that she put her pot in the wrong place."], ["로봇 회사에 바로 \"책임져야 해요\"라는 메시지만 보내요", "Only send the company a message saying it must take responsibility."]], "tags": ["기능③", "기능③, 지식·이해②", "가치·태도④", "지식·이해②"], "feedback": [["깨진 자리는 중요한 단서예요. 하지만 그것만으로는 로봇의 한계와 사용 방법을 알 수 없어요.", "The broken pot’s location is a useful clue. But it cannot tell us everything about the robot’s limits and use."], ["낮은 물건을 놓칠 수 있다는 설명과 민호의 행동을 확인했어요. 어떤 안내를 받았는지도 더 알아봐요.", "You checked the robot’s limits and Minho’s actions. Find out what instructions he received too."], ["작품 위치만으로 가영이의 잘못을 정할 수는 없어요. 센서의 한계와 보관 안내도 확인해요.", "The pot’s location alone does not show Gayoung was at fault. Check the sensor limits and storage instructions."], ["회사에 설명을 요구할 수 있어요. 어떤 문제를 고쳐야 하는지 알려면 설명서와 행동 기록도 살펴봐요.", "You can ask the company to explain. Also check the manual and action record to find what needs to change."]]}, {"situation": ["민호, 가영, 선생님, 로봇 회사 각각의 설명을 듣는다.", "Ask Minho, Gayoung, the teacher and the robot company about the accident."], "options": [["민호 말만 믿고 사건을 끝내요", "Believe only Minho and close the case."], ["가영이 말만 믿고 민호를 탓해요", "Believe only Gayoung and blame Minho."], ["네 사람의 이야기를 단서와 맞춰 보고, 누가 어떤 행동이나 결정을 설명해야 하는지 살펴봐요", "Compare all four accounts with the clues. Ask who needs to explain which action or decision."], ["청소로봇(AI)만 탓하고 사람들 이야기는 안 들어요", "Only blame the AI and ignore the people."]], "tags": ["지식·이해①", "가치·태도④", "지식·이해①, 가치·태도④", "지식·이해②"], "feedback": [["민호의 설명은 중요한 단서예요. 다른 사람의 설명과 맞춰 봐야 놓친 원인을 찾을 수 있어요.", "Minho’s account matters. Compare it with the others to find causes you may have missed."], ["가영이의 속상함을 들어줘야 해요. 하지만 속상하다는 사실만으로 민호의 잘못을 정할 수는 없어요.", "Listen to Gayoung’s feelings. Her being upset alone does not prove Minho was at fault."], ["모두의 이야기를 들었어요. 각자 무엇을 알고 있었고, 무엇을 할 수 있었는지 단서와 맞춰 책임을 따져봐요.", "You heard everyone. Compare what each person knew and could do with the clues."], ["AI만 탓하면 만든 사람의 설계와 안내, 사용하는 방법에서 고칠 점을 놓칠 수 있어요.", "Only blaming AI may hide problems in design, instructions and use."]]}, {"situation": ["조사단은 단서에 따라 각자의 책임을 판단하고, 가영이의 작품 회복과 재발 방지 방법을 정한다.", "Use the clues to consider responsibility, help Gayoung and prevent another accident."], "options": [["민호에게만 전부 책임을 지워요", "Make Minho take all the blame."], ["단서를 바탕으로 각자의 책임을 따지고, 가영이의 작품을 어떻게 회복할지와 같은 사고를 막을 방법을 제안해요", "Use the clues to consider each role, help restore Gayoung’s work and prevent another accident."], ["가영이가 참으면 되는 일이라고 넘겨요", "Say Gayoung just has to put up with it."], ["청소로봇을 아예 못 쓰게 금지해요", "Ban the robot forever."]], "tags": ["기능③", "기능③, 가치·태도④", "가치·태도④", "기능③"], "feedback": [["로봇을 켠 민호에게만 책임을 지우면 센서의 한계와 안내 부족은 그대로 남아요. 단서를 함께 살펴봐요.", "Blaming only Minho leaves the sensor limits and unclear instructions unchanged. Check all the clues."], ["회사는 감지 한계를 설명하고 개선 방법을 살펴보기로 했어요. 선생님은 안내 내용을 보완하고, 가영이의 뜻을 물어 회사와 작품 수리나 다시 만들기 지원을 의논하기로 했어요. 민호도 안내받은 방법으로 청소 전 주변을 확인하기로 했어요. 예방에 함께 참여한다고 모두에게 사고의 잘못이 있다는 뜻은 아니에요.", "The company will explain the limits and explore improvements. The teacher will improve instructions and discuss support with Gayoung and the company. Minho will check the area as instructed. Helping prevent accidents does not mean everyone was at fault."], ["가영이에게 참으라고만 하면 피해가 해결되지 않아요. 원하는 회복 방법을 듣고 도울 방법을 찾아봐요.", "Asking Gayoung to put up with it does not repair the harm. Ask what help she wants."], ["안전을 확인할 때까지 사용을 멈출 수는 있어요. 영구히 금지하는 것만으로는 작품 회복과 원인에 맞는 개선이 이루어지지 않아요.", "You can pause use until safety is checked. A permanent ban alone does not restore the pot or fix the causes."]]}];
const T={brand:['책임성 타운 · 책임 조사단','ACCOUNTABILITY TOWN · INVESTIGATION TEAM'],book:['▤ 조사 수첩','▤ Notebook'],help:['? 도움이 필요해요','? Help me'],sound:['소리 꺼짐','Sound off'],soundOn:['소리 켜짐','Sound on'],close:['닫기','Close'],next:['다음으로 →','Next →'],confirm:['확인했어요 ✓','I checked this ✓'],again:['다시 보기','Read again'],easy:['쉬운 말로 보기','Simpler words'],other:['Show English','한국어도 보기'],task:['지금 할 일','YOUR NEXT STEP'],start:['조사 시작하기 →','Start investigating →'],intro:['깨진 화분의\n비밀을 찾아요','The case of\nthe broken pot'],desc:['로봇이 지나간 뒤, 가영이의 화분이 깨졌어요. 단서를 모으고 사람들의 이야기를 들어봐요.','Gayoung’s pot broke after the robot passed by. Gather clues and hear everyone’s story.'],rule:['네 단계를 마치고 배운 점 카드를 받으면 탐험 완료예요. 모든 답을 맞힐 필요는 없어요.','Finish four steps and receive your learning card to complete the investigation. You do not need every answer right.'],char:['함께할 캐릭터를 골라요','Choose your character'],nick:['한글 닉네임을 골라요','Choose a Korean nickname'],ready:['준비되면 시작해요. 시간제한은 없어요.','Start when you are ready. There is no time limit.'],step:['단계','Step'],current:['진행 중','In progress'],done:['완료','Done'],wait:['필수 자료를 확인한 뒤 선택할 수 있어요.','Check the required clues before choosing.'],choose:['단서를 바탕으로 하나를 선택해요.','Use your clues to choose one action.'],checked:['확인했어요','checked'],choice:['조사단의 선택','YOUR DECISION'],feedback:['선택을 돌아봐요','Think about your choice'],facts:['확인된 사실','What we know'],unknown:['더 알아볼 점','What we still need to check'],empty:['자료를 확인하면 수첩에 모여요.','Checked clues will appear here.'],complete:['탐험 완료','Investigation complete'],retry:['다시 탐험하기','Investigate again'],saveFail:['기기에 기록을 저장할 수 없어요. 지금 탐험은 계속할 수 있지만 새로 열면 기록이 남지 않을 수 있어요.','This device cannot save records. You can keep playing, but your record may be missing when you reopen the game.'],keys:['Tab 이동 · Enter/Space 선택 · Esc 닫기','Tab to move · Enter/Space to select · Esc to close'],footer:['오프라인 탐험 · 경쟁 없이, 내 속도로','Offline investigation · At your own pace'],ask:['질문을 골라요','Choose a question'],checkMore:['자료를 눌러 확인해요.','Open a clue and check it.'],hint2:['다음 조사 위치를 표시했어요.','The next investigation spot is highlighted.'],hint3:['표시된 자료를 열어 첫 행동을 보여줄게요.','Let’s open the highlighted clue together.'],helpNext:['도움을 더 볼래요','Show more help'],listen:['이야기 확인','Accounts checked'],clues:['단서 확인','Clues checked'],repair:['회복 계획','Recovery plan'],connect:['행동 카드를 고르고, 함께할 사람을 골라요.','Choose an action card, then the person who can help.'],connected:['계획에 연결했어요. 아직 회복이 끝난 것은 아니에요.','Added to the plan. The repair has not happened yet.'],tryLink:['이 행동을 맡을 수 있는 다른 사람을 살펴봐요.','Look for someone else who can take this action.'],continue:['배운 점 카드 받기 →','Get my learning card →'],account:['책임성은 자신의 행동을 설명하고, 문제를 해결할 역할을 살피는 것이에요.','Accountability means explaining our actions and working out our roles in putting things right.']};
const STEPS=[['사건 보기','See the case'],['단서 찾기','Find clues'],['이야기 듣기','Hear accounts'],['해결하기','Plan a solution']];
const CLUES=[
 {id:'pot',icon:'▧',label:['화분 위치','Pot location'],text:[['가영이의 점토 화분은 바닥 쪽 선반 아래에 있었어요. 청소로봇이 지나가며 쳐서 깨졌어요.'],['Gayoung’s clay pot was under a low shelf. The robot hit it while passing by.']],simple:['화분은 낮은 곳에 있었고 로봇이 부딪쳤어요.','The pot was low down. The robot hit it.']},
 {id:'manual',icon:'▤',label:['로봇 설명서','Robot manual'],text:[['“낮게 놓인 작은 물건은 센서가 놓칠 수 있어요.” 이 경고는 작은 글씨로 적혀 있었어요.'],['“The sensor can miss small, low objects.” This warning was printed in small text.']],simple:['센서는 물건을 알아차리는 장치예요. 낮은 물건을 못 볼 때도 있어요.','A sensor detects objects. It can miss low objects.']},

function continueRound(){if(state.round===3){if(state.choices[3]===2){state.phase='plan';panel='plan';render()}else finish();return}state.round++;state.phase='question';state.target=null;ensureNote();panel='question';render()}
function finish(){if(state.choices[3]!==2)state.plans=[];closePanel();state.screen='end';state.endingPlan=state.plans[0]??null;const ending=classify(state.choices);writeStore('ethicity.result.accountability',{game:'accountability',completed:true,ending,card:CARDS[ending.charCodeAt(0)-65][0]});event('investigation-completed',{ending});render()}
function renderEnd(){const ending=classify(state.choices),reply=state.endingPlan!==null?GAYOUNG_REPLIES[state.endingPlan]:FINAL_REACTIONS[state.choices[3]]||GAYOUNG_REPLIES[0];$('app').innerHTML=`<div class="endGrid"><section class="card"><span class="eyebrow">CASE REPORT · ${L('조사를 마치며','CLOSING THE INVESTIGATION')}</span><h1>${L('가영이에게 전하는 계획','A plan for Gayoung')}</h1>${speaker('gayoung',tr(reply))}<div class="endingPlans">${state.plans.map(i=>btn(escape(tr(HELP_PLANS[i])),'endingPlan:'+i,'',`aria-pressed="${state.endingPlan===i}"`)).join('')}</div><p class="notice">${state.plans.length?L('가영이의 작품을 어떻게 도울지 제안했어요. 회복 방법과 실행 여부는 당사자들과 더 의논해야 해요.','You proposed help for Gayoung’s work. Recovery and carrying out the plan still need discussion.'):L('가영이를 도울 방법은 아직 정하지 못했어요. 마지막 판단으로 돌아가 다시 의논할 수 있어요.','A way to help Gayoung is still undecided. You can return to your final decision.')}</p>${btn(L('마지막 판단 다시 보기','Revisit final decision'),'revisit')}</section><section class="card"><span class="eyebrow">${L('나의 조사 기록','MY INVESTIGATION')}</span><h2>${L('생각은 어떻게 달라졌나요?','How did my thinking change?')}</h2><p>${escape(tr(CARDS[ending.charCodeAt(0)-65]))}</p><details open><summary>${L('의문 → 단서 → 판단 기록','Question → evidence → decision')}</summary>${reportHTML()}</details><div class="actions">${btn(L('PNG 저장','Save PNG'),'png')}${btn(L('JSON 저장','Save JSON'),'json')}</div><p class="muted">${L('다운로드한 파일은 선생님께 직접 전달할 수 있어요.','You can share the downloaded file with your teacher.')}</p>${btn(L('처음 화면','Start screen'),'restart')}</section></div>`}
function reportHTML(){return state.notes.map(n=>`<details><summary>${n.round+1}. ${escape(n.text)}</summary>${n.evidence.map(e=>`<p>✓ ${escape(tr(e.fact))}</p>`).join('')}${state.history.filter(h=>h.round===n.round+1&&h.type.startsWith('decision-')).map(h=>`<p>${h.before?L('변경','Revised'):L('첫 판단','First decision')}: ${escape(tr(ROUNDS[n.round].options[h.after-1]))}</p>`).join('')}<p>${escape(n.reflection)}</p></details>`).join('')}
function download(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportPNG(){const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d'),lines=[];ctx.font='22px sans-serif';const add=text=>{let line='';for(const char of String(text)){if(ctx.measureText(line+char).width>970){lines.push(line);line=''}line+=char}lines.push(line,'')};add(L('책임성 조사 기록','Accountability investigation')+' · '+player.nickname);state.notes.forEach(n=>{add(`${n.round+1}. ${n.text}`);n.evidence.forEach(e=>add('✓ '+tr(e.fact)));state.history.filter(h=>h.round===n.round+1&&h.type.startsWith('decision-')).forEach(h=>add((h.before?L('바꾼 판단: ','Revised: '):L('첫 판단: ','First decision: '))+tr(ROUNDS[n.round].options[h.after-1])));if(n.reflection)add(n.reflection)});state.plans.forEach(i=>add(tr(HELP_PLANS[i])));add(L('도움 계획은 제안이며, 아직 실행 결과가 아닙니다.','Help plans are proposals, not completed outcomes.'));canvas.width=1080;canvas.height=Math.max(500,lines.length*34+100);ctx.fillStyle='#fffdf3';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#203c42';ctx.font='22px sans-serif';lines.forEach((line,i)=>ctx.fillText(line,50,60+i*34));canvas.toBlob(blob=>{if(blob)download(blob,'accountability-log.png')},'image/png')}
function act(action){const [a,v]=action.split(':');if(a==='language')return switchLanguage();if(a==='close')return closePanel();if(a==='avatar'){player.character=['char_03','char_04'][+v];player.nickname=$('nickname').value;return render()}if(a==='start'){player.nickname=$('nickname').value;writeStore('ethicity.player',player);state={screen:'play',round:0,phase:'question',seen:[],notes:[],choices:[],history:[],target:null,plans:[],endingPlan:null};startedAt=new Date().toISOString();Object.assign(explorer,{x:240,y:268,route:[],dir:'down'});ensureNote();event('investigation-started');render();return openPanel('question')}if(a==='question'){if(panel)closePanel();return openPanel('question')}if(a==='source')return selectSource(v);if(a==='primary'){if(state.phase==='explore')return walkToTarget();return openPanel(state.phase)}if(a==='inspect')return inspectNearby();if(a==='mark'){marks.includes(+v)?marks=marks.filter(i=>i!==+v):marks.push(+v);return renderPanel()}if(a==='record')return recordEvidence();if(a==='review'){if(panel)closePanel();state.phase='review';render();return openPanel('review')}if(a==='decision'){if(missing().length)return;if(panel)closePanel();state.phase='decision';render();return openPanel('decision')}if(a==='choose')return choose(+v);if(a==='continue')return continueRound();if(a==='plan'){state.plans.includes(+v)?state.plans=state.plans.filter(i=>i!==+v):state.plans.push(+v);saveLog();return renderPanel()}if(a==='finish')return finish();if(a==='easy'){easy=!easy;return renderPanel()}if(a==='endingPlan'){state.endingPlan=+v;event('plan-response-viewed',{plan:+v});return render()}if(a==='revisit'){state.screen='play';state.phase='decision';render();return openPanel('decision')}if(a==='previous'){const previous=readStore('ethicity.log.accountability');if(previous)download(new Blob([JSON.stringify(previous,null,2)],{type:'application/json'}),'accountability-previous-log.json');return}if(a==='json')return download(new Blob([JSON.stringify(logData(),null,2)],{type:'application/json'}),'accountability-log.json');if(a==='png')return exportPNG();if(a==='restart'){state.screen='start';panel=null;startedAt=null;return render()}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(b&&!b.disabled)act(b.dataset.action)});
$('modal').addEventListener('cancel',e=>{e.preventDefault();closePanel()});$('notebook').onclick=()=>openPanel('book');$('help').onclick=()=>openPanel('help');$('brand').onclick=e=>e.preventDefault();$('lang').onclick=switchLanguage;function switchLanguage(){if($('memo'))storeDraft();if($('reflection'))note().reflection=$('reflection').value;lang=lang==='ko'?'en':'ko';state.notes.forEach(n=>{if(!n.edits.length){n.text=tr(DEFAULT_QUESTIONS[n.round]);if(n.initialText)n.initialText=n.text}});writeStore('ethicity.settings.accountability',{language:lang});render()}
render();requestAnimationFrame(worldFrame);

</script><script src="accountability-revision.js"></script></body></html>
