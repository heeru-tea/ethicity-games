<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="윤리시티 · AI 윤리 탐험대 — 투명성. 루미튜브 숏츠로 발표 자료를 모으며 AI 제작 표시와 추천 이유가 왜 필요한지 겪어 보는 혼자 하는 미니게임입니다.">
<meta name="theme-color" content="#294b40">
<link rel="icon" href="data:,">
<title>윤리시티 · 루미튜브로 발표 준비하기 · 투명성</title>
<link rel="stylesheet" href="../shared/ethicity-elementary-common-v1/runtime/common.css">
<link rel="stylesheet" href="game.css">
</head>
<body class="ee-theme game-transparency">
<div class="tp-app" id="app">
  <header class="tp-hud ee-panel">
    <div class="tp-hud-title">
      <canvas class="ee-icon" width="64" height="64" data-icon="robot" aria-hidden="true"></canvas>
      <h1>루미튜브로 발표 준비하기</h1>
    </div>
    <div class="tp-hud-right">
      <span class="ee-badge" id="hudDay">시작</span>
      <span class="ee-badge" id="hudSubject" hidden></span>
      <span class="ee-badge" id="hudCards" hidden>카드 0/5</span>
      <button type="button" class="ee-button secondary" id="btnSound" aria-pressed="false">효과음 끔</button>
    </div>
  </header>
  <p class="tp-status" id="status" role="status" aria-live="polite"></p>
  <main class="tp-main" id="main">
    <div class="tp-left" id="left">
      <section class="tp-scene" id="sceneWrap" hidden>
        <canvas id="stage" width="1280" height="720" role="img" aria-label="장면"></canvas>
      </section>
      <section class="tp-panel ee-panel" id="panel"></section>
    </div>
    <section class="tp-side" id="side" hidden></section>
  </main>
</div>
<script src="../shared/ethicity-elementary-common-v1/runtime/manifest.js"></script>
<script src="../shared/ethicity-elementary-common-v1/runtime/common.js"></script>
<script src="bgm.js"></script>
<script src="report-card.js"></script>
<script src="game.js"></script>
</body>
</html>
